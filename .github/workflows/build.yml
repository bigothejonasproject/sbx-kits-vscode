name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  KIT_REF: docker.io/oiradoc/sbx-vscode-kit:latest

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      # sbx refuses every command, even validate, until signed in.
      - name: Sign in to sbx
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | sbx login --username "$DOCKERHUB_USERNAME" --password-stdin

      # Schema-aware check: catches v1 fields in a v2 spec, not just YAML syntax.
      - name: Validate kit
        run: sbx kit validate .

  image:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: oiradoc/sbx-vscode:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Republish the kit so the registry copy of spec.yaml never lags behind main.
  kit:
    runs-on: ubuntu-24.04
    needs: image
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Install sbx
        run: |
          curl -fsSL https://get.docker.com | sudo REPO_ONLY=1 sh
          sudo apt-get install -y docker-sbx

      # The sbx login session is also what kit push authenticates with.
      - name: Sign in to sbx
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | sbx login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push kit
        run: sbx kit push . "$KIT_REF"
